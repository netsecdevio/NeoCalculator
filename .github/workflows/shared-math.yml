name: Shared math boundary
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/wasm/math-client-limits.mjs
      - run: node tests/wasm/keycode-catalog.mjs
      - run: node tests/wasm/persistence-recovery.mjs
      - run: npm ci --prefix tests/wasm --ignore-scripts
      - run: npm audit --prefix tests/wasm --audit-level=moderate
  browser-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "$(cat wasm/emscripten.version)"
          /tmp/emsdk/emsdk activate "$(cat wasm/emscripten.version)"
      - name: Build math module
        run: |
          source /tmp/emsdk/emsdk_env.sh
          bash wasm/math/build.sh Release
      - run: npm ci --prefix tests/wasm --ignore-scripts
      - run: npx --prefix tests/wasm playwright install --with-deps chromium firefox webkit
      - run: node tests/wasm/math.mjs
      - run: node tests/wasm/workspace.mjs
      - run: node tests/wasm/learning-steps.mjs
      - run: node tests/wasm/annotations.mjs
      - run: node tests/wasm/math-display.mjs
      - run: node tests/wasm/branding.mjs
      - run: node tests/wasm/packaging.mjs

  browser-calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calculator build dependencies
        run: |
          python -m pip install platformio
          pio pkg install -e emulator_pc
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "$(cat wasm/emscripten.version)"
          /tmp/emsdk/emsdk activate "$(cat wasm/emscripten.version)"
      - name: Build real calculator
        run: |
          source /tmp/emsdk/emsdk_env.sh
          JOBS=2 bash wasm/build.sh Release
      - run: npm ci --prefix tests/wasm --ignore-scripts
      - run: npx --prefix tests/wasm playwright install --with-deps chromium webkit
      - run: node tests/wasm/component.mjs
      - run: NUMOS_BROWSER=webkit node tests/wasm/component.mjs
      - run: node tests/wasm/package-validation.mjs
      - run: node tests/wasm/student-calculator.mjs
      - run: node tests/wasm/phone-handoff.mjs
